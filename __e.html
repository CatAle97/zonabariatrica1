<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="log">…</pre><div id="b"></div>
<script>
const L=[];const ok=(c,m)=>L.push((c?'PASA  ':'FALLA ')+m);
const TAM=[[390,'movil'],[768,'tablet'],[1024,'tablet-h'],[1440,'desktop']];
let i=0;
function next(){
 if(i>=TAM.length){const m=L.filter(x=>x.startsWith('FALLA')).length;
  document.getElementById('log').textContent=L.join('\n')+'\n\n==> '+(L.length-m)+' PASAN / '+m+' FALLAN';return;}
 const [a,nom]=TAM[i++];
 const f=document.createElement('iframe');
 f.width=a;f.height=900;f.style.cssText='position:absolute;left:-9999px';f.src='http://localhost:8899/index.html';
 f.onload=()=>setTimeout(()=>{
  const w=f.contentWindow,d=f.contentDocument;
  L.push('--- '+nom+' '+a+'px ---');
  d.getElementById('zb-fab').click();
  setTimeout(()=>{
   ok(!d.querySelector('.zb-input'),'campo de escritura ELIMINADO');
   ok(!d.querySelector('.zb-enviar'),'boton de enviar eliminado');
   ok(!d.querySelector('textarea'),'sin ningun textarea en el panel');
   // el panel sigue completo
   ok(!!d.querySelector('.zb-head'),'cabecera intacta');
   ok(!!d.querySelector('.zb-body'),'conversacion intacta');
   ok(!!d.querySelector('.zb-foot'),'aviso legal intacto');
   ok(/Zoe/.test(d.querySelector('.zb-head').innerText),'sigue diciendo Zoe');
   // el pie queda pegado abajo, sin hueco
   const panel=d.getElementById('zb-panel'), foot=d.querySelector('.zb-foot');
   const hueco=Math.round(panel.getBoundingClientRect().bottom-foot.getBoundingClientRect().bottom);
   ok(Math.abs(hueco)<=1,'el pie cierra el panel sin hueco ('+hueco+'px)');
   // WhatsApp sigue accesible
   const rap=[...d.querySelectorAll('.zb-rapida')].map(b=>b.textContent);
   ok(rap.length===6,'6 acciones rapidas');
   ok(rap.some(r=>/WhatsApp/.test(r)),'"Continuar por WhatsApp" sigue disponible');
   // el arbol de opciones funciona
   d.querySelectorAll('.zb-op')[0].click();
   setTimeout(()=>{
    ok(d.querySelectorAll('.zb-fila').length>1,'la conversacion sigue avanzando');
    f.remove();next();
   },900);
  },300);
 },2000);
 document.getElementById('b').appendChild(f);
}
next();
</script></body></html>
