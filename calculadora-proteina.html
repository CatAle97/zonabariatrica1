     GitHub Pages no permite redirecciones de servidor (301), así
     que se hace del modo habitual en sitios estáticos:
       · canonical  → le indica a Google cuál es la página buena
       · noindex    → evita que esta compita en los resultados
       · meta refresh + JavaScript → mueve a la persona
